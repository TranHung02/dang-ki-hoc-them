<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký học thêm</title>

  <style>
* {
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

#home h1,
#home p:first-of-type {
  opacity: 0;
  transform: translateY(20px);
  animation: textFade 1s ease forwards;
  animation-delay: 1.2s;
}

#home button {
  opacity: 0;
  transition: 0.6s ease, transform 0.6s ease;
  transform: translateY(20px);
}

#home button.show-btn { 
  opacity: 1; 
  transform: translateY(-70px);
}

.countdown-title.show { 
  opacity: 1;
  transform: translateY(-20px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

@keyframes textFade {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.expired-text {
  display: none;
  margin-top: 16px;
  font-size: 1.1rem;
  color: #ff0000;
  font-weight: 600;
}

#form {
  max-height: 100vh;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 120px;
}

/*COUNTDOWN*/
.countdown {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}

.time-box {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  font-family: 'Segoe UI', sans-serif;
  opacity: 0;
  transform: translateY(20px);
  animation: boxFade 0.8s ease forwards;
}

#home .time-box {
  opacity: 0;
  transform: translateY(20px);
  animation: boxFade 0.8s ease forwards;
}
#home .time-box:nth-child(1) { animation-delay: 2s; }
#home .time-box:nth-child(2) { animation-delay: 2.2s; }
#home .time-box:nth-child(3) { animation-delay: 2.4s; }
#home .time-box:nth-child(4) { animation-delay: 2.6s; }

@keyframes boxFade {
  to {
    opacity: 1;
    transform: translateY(0); 
  } 
}

.time-box .number {
  font-size: 1.4em;
  font-weight: bold;
}

.time-box .label {
  font-size: 0.7em;
  letter-spacing: 1px;
  margin-top: 4px;
}

@keyframes flyUp {
  to {
    transform: translateY(-50px);
    opacity: 0;
  }
}

.countdown-title, #home button {
  text-align: center;
  font-size: 1.4em !important;
  font-weight: 600;
  margin-top: 50px;
  margin-bottom: 1px;
  color: rgba(255,255,255,0.9);
  opacity: 0;
  transform: translateY(15px);
  transition: opacity 0.3s ease;
}

.hidden { display: none; }

.countdown.move-up {
  animation: countdownUp 0.8s ease forwards;
}

@keyframes countdownUp {
  to {
    transform: translateY(-40px);
  }
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color: white;
  height: 100vh;
}

#app {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
}

.page {
  display: none;
  text-align: center;
  animation: fade 0.6s ease;
}

.bg-image {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background-image: url("background.jpg");
  background-repeat: no-repeat;
  background-position: center;
  background-size: 100% 100%;
  z-index: -2;
}

.club-logo {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid #fff;
  object-fit: cover;
  display: block;
  margin: 0 auto;
  opacity:0;
  transform: translateY(-200px) scale(0.5);
  animation: logoDrop 1s ease forwards;
}

@keyframes logoDrop {
  to {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
}

.page.active {
  display: block;
}

.logo {
  width: 140px;
  opacity: 0.9;
}

h1 {
  font-size: 3em;
}

button {
  padding: 14px 28px;
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #ec73fc, #bce9fd);
  font-size: 16px;
  cursor: pointer;
}

@keyframes fade {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 768px) {
  body { font-size: 15px; }
  #app { padding: 10px; }
  h1 { font-size: 2.2em; line-height: 1.2; }
  h2 { font-size: 1.6em; }
  p { font-size: 0.95em; }
  .logo { width: 110px; margin-bottom: 12px; }
  button {
    width: 90%;
    max-width: 320px;
    padding: 14px;
    font-size: 16px;
  }
}

button:active { transform: scale(0.95); }

label {
  display: block;
  text-align: left;
  width: 290px;
  margin: 10px auto 4px;
  font-size: 14px;
  color: #ddd;
}

.required { color: #ff6b6b; font-weight: bold; }
.note { font-size: 13px; color: #ffffff; margin-top: 6px; }

.form-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 16px;
}

button.secondary {
  background: rgba(255,255,255,0.15);
  color: white;
}

#intro {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #1f1f2e, #0e0e11 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

#intro.hide { animation: introFadeOut 0.8s ease forwards; }

.intro-content {
  text-align: center;
  animation: introZoom 1.2s cubic-bezier(.19,1,.22,1);
}

#intro h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.6rem;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

#intro p {
  font-size: 0.95rem;
  color: #bdbdbd;
  letter-spacing: 1px;
}

.form-group {
  position: relative;
  margin: 20px auto;
  width: 90%;
  max-width: 320px;
}

.form-group input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 23px;
  border: none;
  font-size: 15px;
  color: #fff;
  outline: none;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.form-group label {
  position: absolute;
  left: 18px;
  top: 5px;
  font-size: 15px;
  color: #ffffff;
  pointer-events: none;
  transition: all 0.3s ease;
  padding: 0 4px;
  border-radius: 4px;
  background: transparent;
}

.form-group input:focus + label,
.form-group input:not(:placeholder-shown) + label {
  top: -8px;
  left: 14px;
  font-size: 12px;
  color: #ffffff;
}

.form-group input:focus,
.form-group textarea:focus {
  transform: scale(1.05);   
  border: 2px solid #ffffff; 
}

.form-group textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px 18px;
  border-radius: 23px;
  border: none;
  resize: vertical;
  font-size: 15px;
  color: #fff;
  outline: none;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.form-group textarea:focus + label,
.form-group textarea:not(:placeholder-shown) + label {
  top: -8px;
  left: 14px;
  font-size: 12px;
  color: #ffffff;
}

.form-group textarea:focus {
  transform: scale(1.05);
  border: 2px solid #ffffff;
  font-size: 16px;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: rgba(255,255,255,0.7);
}

@media (max-width: 768px) {
  #home { margin-top: -80px; padding-bottom: 40px; }
  .club-logo { width: 180px; height: 180px; margin-bottom: 20px; }
  #home h1 { font-size: 2.6em; margin-bottom: 12px; }
  #home p { font-size: 1.05em; line-height: 1.5; margin-bottom: 14px; }
  #home .countdown-title { margin-top: 36px; margin-bottom: 22px; }
  #home .countdown { margin-bottom: 48px; margin-top: 40px; }
  #home button.show-btn { transform: translateY(-100px); }
  #home button { margin-top: 30px; }
  .countdown { gap: 14px; margin-top: 24px; }
  .time-box { width: 90px; height: 90px; }
  .time-box .number { font-size: 1.6em; }
  .time-box .label { font-size: 0.75em; }
  #home button { font-size: 17px; padding: 16px; margin-top: 40px; }
  #form h2 { font-size: 1.9em; line-height: 1.3; margin-bottom: 20px; }
  .form-group { max-width: 360px; margin: 22px auto; }
  .form-group input,
  .form-group textarea { padding: 16px 20px; font-size: 16px; border-radius: 26px; }
  .form-group label { font-size: 15px; }
  .form-group input:focus + label,
  .form-group input:not(:placeholder-shown) + label,
  .form-group textarea:focus + label,
  .form-group textarea:not(:placeholder-shown) + label { font-size: 13px; }
  .form-group textarea { min-height: 150px; }
  .form-buttons { flex-direction: row; justify-content: center; gap: 12px; }
  .form-buttons button { width: auto; min-width: 140px; padding: 14px 18px; font-size: 15px; }
  .note { font-size: 14px; margin-top: 10px; }
}

@media (max-width: 420px) {
  #app { transform: scale(0.75) translateY(8vh); }
}

@media (max-width: 360px) {
  #app { transform: scale(0.7) translateY(10vh); }
}
  </style>
</head>
<body>

<div class="bg-image"></div>
<div class="overlay"></div>

<div id="app">

  <!-- HOME -->
  <section id="home" class="page active">
    <img 
      src="logo.jpg"
      class="club-logo"
      alt="Logo"
    >
    <h1>Đăng ký học thêm</h1>
    <p>
      Sẵn sàng trở thành thành viên của trung tâm chưa nào!
    </p>
    <p class="countdown-title">Kết thúc sau:</p>
    <div class="countdown">
      <div class="time-box"><span class="number days">123</span><span class="label">NGÀY</span></div>
      <div class="time-box"><span class="number hours">15</span><span class="label">GIỜ</span></div>
      <div class="time-box"><span class="number minutes">45</span><span class="label">PHÚT</span></div>
      <div class="time-box"><span class="number seconds">57</span><span class="label">GIÂY</span></div>
    </div>

    <button onclick="goTo('form')">Đăng ký ngay</button>
    <div class="expired-text" style="display:none; color:#ff6b6b; font-weight:600; margin-top:12px;">
      Đăng ký đã hết hạn - dev by Tr.Hug
    </div>
  </section>

  <!-- FORM -->
  <section id="form" class="page">
    <h2>Đăng ký học thêm</h2>

    <div class="form-group">
      <input type="text" id="student-name" placeholder=" " required>
      <label for="student-name">Họ và tên học sinh *</label>
    </div>

    <div class="form-group">
      <input type="text" id="parent-name" placeholder=" " required>
      <label for="parent-name">Họ và tên phụ huynh *</label>
    </div>

    <div class="form-group">
      <input type="text" id="class" placeholder=" " required>
      <label for="class">Lớp *</label>
    </div>

    <div class="form-group">
      <input type="tel" id="phone" placeholder=" " required>
      <label for="phone">Số điện thoại phụ huynh *</label>
    </div>

    <div class="form-group">
      <textarea id="request" placeholder=" "></textarea>
      <label for="request">Yêu cầu thêm</label>
    </div>

    <p class="note">
      Các mục có dấu <span class="required">*</span> là bắt buộc
    </p>

    <div class="form-buttons">
      <button class="secondary" onclick="goTo('home')">Quay lại</button>
      <button onclick="submitForm()">Gửi đăng ký</button>
    </div>
  </section>

  <!-- THANK YOU -->
  <section id="thanks" class="page">
    <h2>Cảm ơn bạn 🌿</h2>
    <p>Đơn đăng ký của bạn đã được gửi thành công.</p>
    <button onclick="goTo('home')">Về trang chủ</button>
  </section>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const home = document.getElementById("home");
  const countdown = home.querySelector(".countdown");
  const btn = home.querySelector("button");
  const endsIn = home.querySelector(".countdown-title");

  const inputs = document.querySelectorAll('input, textarea');
  inputs.forEach(el => {
    el.addEventListener('focus', () => {
      setTimeout(() => {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 300);
    });
  });

  let expiredText = home.querySelector(".expired-text");
  if (!expiredText) {
    expiredText = document.createElement("div");
    expiredText.className = "expired-text";
    expiredText.textContent = "Đăng ký đã hết hạn";
    expiredText.style.display = "none";
    expiredText.style.color = "#ff6b6b";
    expiredText.style.fontWeight = "600";
    expiredText.style.marginTop = "12px";
    home.appendChild(expiredText);
  }

  setTimeout(() => {
    countdown.classList.add("move-up");
    setTimeout(() => {
      btn.classList.add("show-btn");
      endsIn.classList.add("show");
    }, 150);
  }, 3500);

  const elDays    = home.querySelector(".days");
  const elHours   = home.querySelector(".hours");
  const elMinutes = home.querySelector(".minutes");
  const elSeconds = home.querySelector(".seconds");

  const targetDate = new Date(Date.UTC(2026, 6, 1, 17, 0, 0));

  function updateCountdown() {
    const now = new Date();
    let diff = targetDate - now;

    if (diff <= 0) {
      diff = 0;
      if (btn) btn.style.display = "none";
      if (expiredText) expiredText.style.display = "block";
    }

    const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    if (elDays)    elDays.textContent    = days;
    if (elHours)   elHours.textContent   = String(hours).padStart(2, "0");
    if (elMinutes) elMinutes.textContent = String(minutes).padStart(2, "0");
    if (elSeconds) elSeconds.textContent = String(seconds).padStart(2, "0");
  }

  updateCountdown();
  const timer = setInterval(() => {
    updateCountdown();
    if (targetDate - new Date() <= 0) clearInterval(timer);
  }, 1000);

});

function goTo(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function submitForm() {
  const studentName = document.getElementById("student-name").value.trim();
  const parentName  = document.getElementById("parent-name").value.trim();
  const className   = document.getElementById("class").value.trim();
  const phone       = document.getElementById("phone").value.trim();
  const request     = document.getElementById("request").value.trim();

  if (!studentName || !parentName || !className || !phone) {
    alert("Vui lòng điền đầy đủ các mục bắt buộc (*)");
    return;
  }

  const data = {
    hoten_hocsinh: studentName,
    hoten_phuhuynh: parentName,
    lop: className,
    sdt_phuhuynh: phone,
    yeucauthem: request
  };

  fetch("https://script.google.com/macros/s/AKfycbytnsmTmoKsWs-SFkAvKhY4k6X3UMMage5lDBF7z8up6mVj7Q1f9YPgWjM1POBpE48Z/exec", {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });
  goTo("thanks");
}
</script>

</body>
</html>
